services:
  - type: web
    name: family-ledger
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"

      # Postgres connection string. Without this the ledger falls back to
      # JSON files under data/, which Render's free tier wipes on every
      # redeploy — so this is effectively required in production.
      - key: DATABASE_URL
        sync: false

      # Signs the login session cookie. Changing it logs everyone out.
      - key: COOKIE_SECRET
        sync: false

      # Public URL of this service, used to build links in outgoing email
      # (verification, password reset). Must match the real host or the
      # links in those emails point nowhere.
      - key: APP_URL
        sync: false

      # Resend — password-reset and verification email.
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

      # Web Push (daily reminders, partner-added-an-expense nudges).
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

      # Shared secret for POST /api/cron/daily-reminder.
      - key: CRON_SECRET
        sync: false

      - key: GEMINI_API_KEY
        sync: false
