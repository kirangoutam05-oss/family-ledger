# DISABLED as the primary keep-warm mechanism. Kept only for manual runs via
# workflow_dispatch. cron-job.org does this job now - see below.
#
# The schedule trigger below is intentionally commented out, not deleted, in
# case cron-job.org's free tier ever changes and this needs to come back.
#
# What happened: GitHub throttles scheduled workflows hard on low-traffic
# repos. This was set to run every 10 minutes across an 18-hour window
# (~200+ runs/day) and, measured over its first two days live, actually ran
# 8 times total with gaps up to 623 minutes between runs - more than 10x the
# 15-minute window Render allows before the instance sleeps. It was not
# keeping anything warm. That is the likely reason the SMS ingest endpoint
# filed zero transactions across those two days despite the automation on
# the phone being correctly configured: real bank SMS kept arriving at a
# sleeping instance and timing out before a response came back.
#
# cron-job.org pings /api/health on its own schedule, outside GitHub's
# throttling entirely, and is the thing actually keeping the instance warm
# now.
#
# Original reasoning, still accurate for the window and the 750-hour math if
# this is ever re-enabled: Render sleeps a free service after 15 idle
# minutes and takes roughly 23 seconds to wake, which is fatal to an
# automation that gets one attempt per message. UTC 01:00-18:59 is
# 06:30-00:29 IST - waking hours in India - at ~550 of 750 free
# instance-hours/month, leaving headroom that round-the-clock pinging would
# not (exceeding the quota suspends every free service until the month
# rolls over, which is worse than the cold start this prevents).

name: Keep warm

on:
  # schedule:
  #   - cron: '*/10 1-18 * * *'
  workflow_dispatch:

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health
        env:
          APP_URL: ${{ vars.APP_URL || 'https://family-ledger-jin3.onrender.com' }}
        run: |
          set -uo pipefail
          # Two attempts: if the instance had already fallen asleep, the first
          # pays the cold start and the second confirms it is actually up
          # rather than still booting.
          for attempt in 1 2; do
            start=$(date +%s)
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$APP_URL/api/health" || echo 000)
            elapsed=$(( $(date +%s) - start ))
            echo "attempt $attempt: $code in ${elapsed}s"
            if [ "$code" = "200" ] && [ "$elapsed" -lt 5 ]; then
              echo "awake and warm"
              exit 0
            fi
            sleep 5
          done

          if [ "$code" = "200" ]; then
            echo "::notice::awake, but the response was slow - it had probably just cold started"
            exit 0
          fi
          echo "::error::service did not respond (last status $code)"
          exit 1
